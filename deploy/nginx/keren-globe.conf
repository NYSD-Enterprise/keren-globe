server {
    listen 80;
    server_name globe-trotters.duckdns.org;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name globe-trotters.duckdns.org;

    ssl_certificate /etc/letsencrypt/live/globe-trotters.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/globe-trotters.duckdns.org/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/keren-globe/frontend/dist;
    index index.html;

    # React Router SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Gateway is the only backend port docker publishes (127.0.0.1:2024)
    location /api/ {
        proxy_pass http://127.0.0.1:2024/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
