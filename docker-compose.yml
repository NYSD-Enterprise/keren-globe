 services:

  # ==========================================
  # API GATEWAY
  # ==========================================
  api-gateway:
    build:
      context: ./api-gateway
    container_name: globetrotter-api-gateway
    ports:
      - "5001:5001"
    environment:
      PORT: 5001
      DESTINATION_SERVICE: http://destination-service:5002
      RECOMMENDATION_SERVICE: http://recommendation-service:5004
      ITINERARY_SERVICE: http://itinerary-service:5003
      AUTH_SERVICE: http://auth-service:5005
    depends_on:
      - destination-service
      - recommendation-service
      - itinerary-service
      - auth-service
    restart: unless-stopped

  # ==========================================
  # AUTH SERVICE
  # ==========================================
  auth-service:
    build:
      context: ./auth-service
    container_name: globetrotter-auth-service
    ports:
      - "5005:5005"
    env_file:
      - ./auth-service/.env
    environment:
      PORT: 5005
    restart: unless-stopped

  # ==========================================
  # DESTINATION SERVICE
  # ==========================================
  destination-service:
    build:
      context: ./destination-service
    container_name: globetrotter-destination-service
    ports:
      - "5002:5002"
    environment:
      PORT: 5002
    restart: unless-stopped

  # ==========================================
  # ITINERARY SERVICE
  # ==========================================
  itinerary-service:
    build:
      context: ./itinerary-service
    container_name: globetrotter-itinerary-service
    ports:
      - "5003:5003"
    environment:
      PORT: 5003
    restart: unless-stopped

  # ==========================================
  # RECOMMENDATION SERVICE
  # ==========================================
  recommendation-service:
    build:
      context: ./recommendation-service
    container_name: globetrotter-recommendation-service
    ports:
      - "5004:5004"
    environment:
      PORT: 5004
      DESTINATION_SERVICE: http://destination-service:5002
    depends_on:
      - destination-service
    restart: unless-stopped
