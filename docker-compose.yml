services:

  # ==========================================
  # API GATEWAY
  # ==========================================

  api-gateway:
    build:
      context: ./api-gateway
    container_name: globetrotter-api-gateway
    ports:
      - "5001:5001"
    environment:
      PORT: 5001
      DESTINATION_SERVICE: http://destination-service:5002
      RECOMMENDATION_SERVICE: http://recommendation-service:5004
      ITINERARY_SERVICE: http://itinerary-service:5003
      AUTH_SERVICE: http://auth-service:5005

    depends_on:
      destination-service:
        condition: service_healthy
      recommendation-service:
        condition: service_healthy
      itinerary-service:
        condition: service_healthy
      auth-service:
        condition: service_healthy

    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:5001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

    restart: unless-stopped


  # ==========================================
  # AUTH SERVICE
  # ==========================================

  auth-service:
    build:
      context: ./auth-service
    container_name: globetrotter-auth-service
    ports:
      - "5005:5005"
    env_file:
      - ./auth-service/.env
    environment:
      PORT: 5005

    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:5005/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

    restart: unless-stopped


  # ==========================================
  # DESTINATION SERVICE
  # ==========================================

  destination-service:
    build:
      context: ./destination-service
    container_name: globetrotter-destination-service
    ports:
      - "5002:5002"
    environment:
      PORT: 5002

    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:5002/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

    restart: unless-stopped


  # ==========================================
  # ITINERARY SERVICE
  # ==========================================

  itinerary-service:
    build:
      context: ./itinerary-service
    container_name: globetrotter-itinerary-service
    ports:
      - "5003:5003"
    environment:
      PORT: 5003

    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:5003/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

    restart: unless-stopped


  # ==========================================
  # RECOMMENDATION SERVICE
  # ==========================================

  recommendation-service:
    build:
      context: ./recommendation-service
    container_name: globetrotter-recommendation-service
    ports:
      - "5004:5004"
    environment:
      PORT: 5004
      DESTINATION_SERVICE: http://destination-service:5002

    depends_on:
      destination-service:
        condition: service_healthy

    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:5004/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

    restart: unless-stopped